name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  # Настоящий образ и настоящий Postgres из docker-compose. Токен выдуманный: бот применяет
  # миграции, Telegram отклоняет токен, и процесс выходит с понятной ошибкой.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Настройки
        run: |
          printf 'BOT_TOKEN=123456:%s\nOWNER_IDS=1\nPOSTGRES_PASSWORD=ci\nSECRET_KEY=ci\n' \
            "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" > .env
      - name: Сборка и запуск базы
        run: docker compose up -d --build --wait db
      - name: Память по слоям
        run: docker compose run --rm --no-deps -v "$PWD/scripts:/app/scripts:ro" bot python scripts/memcheck.py
      - name: Запуск бота
        run: |
          set +e
          output=$(timeout 120 docker compose run --rm bot 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" = 1
          grep -q "Применены миграции" <<<"$output"
          grep -q "не принял BOT_TOKEN" <<<"$output"
      - name: Схема в базе
        run: docker compose exec -T db psql -U modbot -d modbot -c '\dt' | grep punishments
      - name: Логи при сбое
        if: failure()
        run: docker compose logs --no-color
