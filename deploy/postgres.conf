# Postgres под маленький VPS: контейнеру выделено 256 МБ.
listen_addresses = '*'
max_connections = 20
timezone = 'UTC'

shared_buffers = 64MB
effective_cache_size = 192MB
work_mem = 4MB
maintenance_work_mem = 32MB
wal_buffers = 4MB

# Реже пишем контрольные точки: меньше нагрузка на диск.
max_wal_size = 256MB
min_wal_size = 64MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Запросы у бота короткие и точечные: параллельность и JIT только занимают память.
max_parallel_workers_per_gather = 0
jit = off
huge_pages = off
random_page_cost = 1.1

# Таблица счётчиков обновляется постоянно, её нужно чистить чаще обычного.
autovacuum_naptime = 30s
autovacuum_max_workers = 2

# В логах видно только то, что стоит ускорить.
log_min_duration_statement = 250
