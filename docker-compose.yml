services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: modbot
      POSTGRES_USER: modbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modbot -d modbot"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://modbot:${POSTGRES_PASSWORD}@db:5432/modbot
      # Меньше арен glibc: процесс не держит лишнюю память.
      MALLOC_ARENA_MAX: "2"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 192m
    pids_limit: 64
    # Боту не нужно ничего писать на диск и ничего менять в системе.
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

# Наружу не открыт ни один порт: бот сам ходит в Telegram, база доступна только внутри Docker.
volumes:
  pgdata:
